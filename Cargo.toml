[workspace]
members = [
    "crates/corx-core",
    "crates/corx-server",
    "crates/corx",
    "crates/corx-cli",
]
default-members = ["crates/corx-cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qntx/corx"
homepage = "https://github.com/qntx/corx"
authors = ["QNTX <https://qntx.fun>"]
keywords = ["cors", "proxy"]
categories = ["network-programming"]

[workspace.dependencies]
# Internal crates
corx-core = { path = "crates/corx-core", version = "0.2.0" }
corx-server = { path = "crates/corx-server", version = "0.2.0" }
corx = { path = "crates/corx", version = "0.2.0" }

# HTTP core
hyper = { version = "1.11", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.20", features = [
    "tokio",
    "server-auto",
    "server-graceful",
    "client-legacy",
    "http1",
    "http2",
] }
http = "1.5"
http-body = "1.0"
http-body-util = "0.1.4"
bytes = "1.12"

# Web framework (thin layer over hyper)
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "http2",
    "tokio",
    "matched-path",
    "original-uri",
    "query",
    "json",
] }
axum-server = { version = "0.8", default-features = false, features = [
    "tls-rustls-no-provider",
] }
tower = { version = "0.5.3", features = ["util", "timeout", "load-shed"] }
tower-http = { version = "0.6.8", features = [
    "trace",
    "limit",
    "timeout",
    "set-header",
    "catch-panic",
] }
tower-service = "0.3.3"

# Async runtime
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "signal",
    "macros",
    "time",
    "fs",
] }
futures = { version = "0.3.33", default-features = false, features = ["std"] }
pin-project-lite = "0.2.17"

# TLS (client side for outbound HTTPS; server TLS is gated by feature `tls`)
# Stay on the 0.23 line: 0.24 is not a stable release.
rustls = { version = "0.23.40", default-features = false, features = [
    "std",
    "tls12",
    "ring",
] }
tokio-rustls = { version = "0.26.4", default-features = false, features = [
    "tls12",
    "ring",
] }
rustls-platform-verifier = "0.6"
hyper-rustls = { version = "0.27.9", default-features = false, features = [
    "http1",
    "http2",
    "ring",
    "logging",
    "tls12",
] }
rustls-pemfile = "2.2"

# DNS (pure Rust, with cache)
# 0.25/0.26 change public APIs; upgrade in a dedicated PR after resolver adapter work.
hickory-resolver = { version = "0.24.4", default-features = false, features = [
    "tokio-runtime",
    "system-config",
] }

# URL / IP / IDN
url = "2.5.8"
ipnet = "2.12"
idna = "1.1"
percent-encoding = "2.3.2"

# Concurrency data structures
foldhash = "0.1.5"
arc-swap = "1.9"
# dashmap 7 is still RC; stay on 6.x for production.
dashmap = "6.1"

# Rate limit (GCRA, lock-free hot path)
governor = { version = "0.10", default-features = false, features = [
    "std",
    "dashmap",
    "quanta",
] }
nonzero_ext = "0.3"

# Regex for unlimited-host allowlists
regex = "1.13"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "std",
    "fmt",
    "json",
    "ansi",
    "env-filter",
    "registry",
] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = [
    "http-listener",
] }
# OTel crate set is upgraded together (API surface is tightly coupled).
opentelemetry = { version = "0.30", default-features = false, features = [
    "trace",
] }
opentelemetry_sdk = { version = "0.30", default-features = false, features = [
    "trace",
    "rt-tokio",
] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = [
    "trace",
    "grpc-tonic",
    "http-proto",
] }
tracing-opentelemetry = { version = "0.31", default-features = false }

# Config / CLI
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# toml 1.x is a different crate lineage; figment still pins the 0.8 series.
toml = { version = "1.1.5", default-features = false, features = ["parse", "display"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
humantime-serde = "1.1.1"

# Identifiers
uuid = { version = "1.24", default-features = false, features = [
    "std",
    "v7",
    "rng",
    "fast-rng",
    "serde",
] }

# Error handling
thiserror = "2.0.20"
anyhow = "1.0.104"

# Dev only
wiremock = "0.6.5"
criterion = { version = "0.5.1", default-features = false, features = [
    "async_tokio",
    "html_reports",
] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[profile.dev]
debug = true
opt-level = 0

[profile.test]
opt-level = 2

[profile.ci]
debug = false
inherits = "dev"

[profile.bench]
debug = true
inherits = "release"

[workspace.lints.rust]
unsafe_code = "deny"
elided_lifetimes_in_paths = "warn"
single_use_lifetimes = "warn"
unused_lifetimes = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
variant_size_differences = "warn"
unused_qualifications = "warn"
unused_imports = "warn"
unused_macro_rules = "warn"
unused_must_use = "deny"
unreachable_pub = "warn"
unused_crate_dependencies = "warn"
non_ascii_idents = "deny"
non_camel_case_types = "warn"
non_snake_case = "warn"
non_upper_case_globals = "warn"
keyword_idents = { level = "warn", priority = -1 }
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "warn"
invalid_html_tags = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "allow", priority = -1 }

dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
panic = "warn"
unwrap_used = "warn"
unwrap_in_result = "warn"
expect_used = "warn"
panic_in_result_fn = "warn"
indexing_slicing = "warn"
exit = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
mem_forget = "warn"
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rc_mutex = "warn"

fallible_impl_from = "warn"
error_impl_error = "warn"
let_underscore_must_use = "warn"

rest_pat_in_fully_bound_structs = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
large_types_passed_by_value = "warn"
implicit_hasher = "warn"
redundant_type_annotations = "warn"

str_to_string = "warn"
string_lit_as_bytes = "warn"
needless_raw_string_hashes = "warn"
format_push_string = "warn"

cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
as_underscore = "warn"
cast_precision_loss = "allow"

future_not_send = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
significant_drop_tightening = "warn"

match_wildcard_for_single_variants = "warn"
match_same_arms = "warn"
option_if_let_else = "warn"
wildcard_enum_match_arm = "allow"

cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"

used_underscore_binding = "warn"
verbose_file_reads = "warn"
tests_outside_test_module = "warn"
unnecessary_self_imports = "warn"
infinite_loop = "warn"
allow_attributes_without_reason = "warn"
missing_assert_message = "warn"
empty_line_after_doc_comments = "warn"
empty_line_after_outer_attr = "warn"

missing_docs_in_private_items = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
doc_markdown = "warn"
must_use_candidate = "warn"
return_self_not_must_use = "warn"

exhaustive_enums = "allow"
exhaustive_structs = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "warn"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
semicolon_inside_block = "allow"
semicolon_outside_block = "allow"
redundant_pub_crate = "allow"
