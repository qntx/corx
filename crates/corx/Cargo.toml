[package]
name = "corx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "High-performance CORS forwarding proxy — library facade"
readme = "README.md"

[lib]
name = "corx"
path = "src/lib.rs"

[features]
default = []
## Inbound TLS termination (rustls).
tls = ["corx-server/tls"]
## Mutual TLS (implies `tls`).
mtls = ["corx-server/mtls"]
## FIPS-validated crypto provider via aws-lc-rs.
fips = ["corx-core/fips", "corx-server/fips"]
## OpenTelemetry / OTLP tracing export.
otel = ["corx-server/otel"]
## All production optional features.
full = ["tls", "mtls", "otel"]

[dependencies]
corx-core = { workspace = true }
corx-server = { workspace = true }

[lints]
workspace = true
