name: Publish to crates.io

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    uses: qntx/workflows/.github/workflows/publish-crates.yml@461b483156e434d004b0d936e24cca6b9aabd659
    permissions:
      contents: read
    with:
      packages: "corx"
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
