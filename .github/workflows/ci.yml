name: CI

on:
  push:
    branches: [main]
  # Any base branch, so every PR of a stack is checked on its own.
  pull_request:

permissions:
  contents: read

jobs:
  taplo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes @taplo/cli@0.7.0 fmt --check

  ci:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@461b483156e434d004b0d936e24cca6b9aabd659
    permissions:
      contents: read
    with:
      deny: true
      doc: true

  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      nightly: ${{ steps.pin.outputs.nightly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        run: echo "nightly=$(cat .github/nightly-toolchain)" >> "$GITHUB_OUTPUT"

  wasm:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@461b483156e434d004b0d936e24cca6b9aabd659
    permissions:
      contents: read
    with:
      targets: wasm32-unknown-unknown
      packages: corx corx-worker
      features: --all-features

  fuzz:
    needs: toolchain
    uses: qntx/workflows/.github/workflows/ci-rust-fuzz.yml@461b483156e434d004b0d936e24cca6b9aabd659
    permissions:
      contents: read
    with:
      max-total-time: 60
      rust-version: ${{ needs.toolchain.outputs.nightly }}

  conformance-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: conformance-native
      - name: Run the conformance suite against the native edition
        run: crates/corx-conformance/run.sh native

  conformance-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the wasm32 target and worker-build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install worker-build --version 0.9.0 --locked
      - name: Run the conformance suite against the Workers edition
        run: crates/corx-conformance/run.sh worker
